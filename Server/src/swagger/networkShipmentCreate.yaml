      responses:
        "201":
          description: Shipment flow created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShipmentFlowResponse"
        "400":
          description: Invalid request payload or shipment creation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    CreateShipmentFlowRequest:
      allOf:
        - $ref: "#/components/schemas/CreateShipmentRequest"

    CreateShipmentFlowResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Shipment flow created successfully
        data:
          type: object
          properties:
            shipmentId:
              type: integer
              example: 1001

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid request payload
