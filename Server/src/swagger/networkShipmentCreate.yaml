openapi: 3.0.0
info:
  title: Network Shipment Create API
  version: 1.0.0
  description: Swagger documentation for the new generic shipment creation flow endpoint

tags:
  - name: Network Shipment Create
    description: Generic shipment creation flow operations

paths:
  /api/network-shipment/flow:
    post:
      tags: [Network Shipment Create]
      summary: Create a shipment using the generic shipment flow
      description: Creates a shipment and its related customer, commodity, carrier, rate, and accessorial records through the new generic payload flow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShipmentFlowRequest"
            examples:
              genericFlow:
                summary: Example of the generic shipment creation payload
                value:
                  shipmentDetails:
                    typeOfShipment: "AIR_IMPORT"
                    serviceLevel: "Regular"
                    shipmentDate: "2024-07-01"
                    shipmentTime: "09:00:00"
                    status: "ORDER_RECEIVED_PICKUP_PENDING"
                  customerDetails:
                    customerId: 110
                    stationId: 183
                    airportPickupService: "N"
                    airportDeliveryService: "N"
                    originAirportCode: "LAX"
                    destinationAirportCode: "JFK"
                    customerReferenceNumbers:
                      - referenceType: "PO"
                        referenceNumber: "PO-12345"
                      - referenceType: "BOL"
                        referenceNumber: "BOL-67890"
                    shipperDetails:
                      shipperName: "ABC Shipper"
                      addressLine1: "123 Shipper Way"
                      city: "Los Angeles"
                      state: "CA"
                      zipCode: "90001"
                      contactPersonName: "John Shipper"
                      phoneNumber: "+1-555-0123"
                    consigneeDetails:
