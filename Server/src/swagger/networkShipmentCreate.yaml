              mixedAirlineFlow:
                summary: Example using both pickup and delivery airline details
                value:
                  shipmentDetails:
                    typeOfShipment: "AIR_IMPORT"
                    serviceLevel: "Urgent"
                    shipmentDate: "2024-07-05"
                    shipmentTime: "12:00:00"
                    status: "MANIFESTED"
