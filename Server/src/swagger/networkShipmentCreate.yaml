                      city: "New York"
                      state: "NY"
                      zipCode: "10001"
                      contactPersonName: "Jane Consignee"
                      phoneNumber: "+1-555-0456"
                  commodityDetails:
                    emergencyContactName: "Mike Johnson"
                    emergencyContactPhone: "+1-555-0789"
                    handlingUnits:
                      - handlingUnitUOM: "PALLET"
                        handlingUnits: 2
                        unit: "EA"
                        handlingLength: 120
                        handlingWidth: 100
                        handlingHeight: 80
                        handlingWeight: 500
                        handlingWeightUnit: "LB"
                        class: "CLASS_1"
                        palletDetails:
                          - pieces: 10
                            piecesUOM: "EA"
                            description: "Electronics"
                            hazmat: "Y"
                            hazmatDetails:
                              unNumber: "UN3480"
                              properShippingName: "Lithium Ion Batteries"
                              hazardClass: "9"
                              packingGroup: "II"
                              weight: 100
                              weightUnit: "LB"
                              technicalName: "Lithium Battery"
                              contactPhoneNumber: "+1-555-0900"
