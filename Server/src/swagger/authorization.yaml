openapi: 3.0.0
info:
  title: User and Role Authorization API
  version: 1.0.0
  description: Isolated RBAC module for user management, role management, login, refresh token handling, and password reset workflow.
tags:
  - name: Authorization
    description: User, role, permission, and authentication operations.
paths:
  /api/authorization/permissions/catalog:
    get:
      tags:
        - Authorization
      summary: Get permissions grouped by application
      description: Returns permissions grouped for the Warehouse, Maintenance, and Network Services tabs. Optionally filter by role kind eligibility.
      parameters:
        - in: query
          name: roleKind
          required: true
          schema:
            type: string
            enum: [EMPLOYEE, CUSTOMER]
      responses:
        "200":
          description: Permission catalog grouped by application
          content:
            application/json:
              example:
                success: true
                data:
                  warehouse:
                    warehouse_receipt:
                      - permissionId: 12
                        permissionCode: PER18
                        displayName: Edit warehouse receipt
                        applicationCode: warehouse
                        permissionKey: warehouse_receipt.receipt.edit
                        moduleKey: warehouse_receipt
                        resourceKey: receipt
                        actionKey: edit
                        forEmployee: Y
                        forCustomer: N
                  maintenance: {}
                  network_services: {}
  /api/authorization/roles/options:
    get:
      tags:
        - Authorization
      summary: Get active roles for dropdowns
      description: Returns active roles with their IDs and role kinds. Optionally filter by role kind.
      parameters:
        - in: query
          name: roleKind
          required: false
          schema:
            type: string
            enum: [EMPLOYEE, CUSTOMER]
      responses:
        "200":
          description: Active roles
          content:
            application/json:
              example:
                success: true
                data:
                  - roleId: 3
                    name: Dispatcher
                    roleKind: EMPLOYEE
  /api/authorization/roles:
    get:
      tags:
        - Authorization
      summary: List all roles
      description: Returns paginated active role records with permission codes, authority roles, and the number of users assigned to each role. roleCounts are stable active-role totals for each kind and are not affected by roleName or roleKind filters.
      parameters:
        - in: query
          name: roleKind
          required: false
          schema:
            type: string
            enum: [EMPLOYEE, CUSTOMER]
        - in: query
          name: roleName
          required: false
          description: Case-insensitive partial match against the role name.
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  - roleId: 1
                    name: SYSTEM
                    roleKind: EMPLOYEE
                    status: ACTIVE
                    createdBy: 1
                    createdByName: System
                    updatedBy: 1
                    updatedByName: System
                    permissionCodes: [PER1, PER2]
                    parentRoleIds: []
                    authorityRoles: []
                    userCount: 12
                pagination:
                  page: 1
                  pageSize: 20
                  totalCount: 1
                  totalPages: 1
                roleCounts:
                  EMPLOYEE: 1
                  CUSTOMER: 0
    post:
      tags:
        - Authorization
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Customer Manager
              description: Manages customer records and service access
              roleKind: EMPLOYEE
              status: ACTIVE
              permissionCodes:
                - PER1
                - PER2
              parentRoleIds: [1, 2]
      responses:
        "201":
          description: Role created
          content:
            application/json:
              example:
                success: true
                data:
                  roleId: 2
                  name: Customer Manager
                  roleKind: EMPLOYEE
                  status: ACTIVE
                  createdBy: 1
                  createdByName: System
                  updatedBy: 1
                  updatedByName: System
  /api/authorization/roles/{roleId}/users:
    get:
      tags:
        - Authorization
      summary: List users assigned to a role
      description: Returns a paginated list of users assigned to the specified role. Search matches userName, loginUserName, or email.
      parameters:
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Users assigned to the role
          content:
            application/json:
              example:
                success: true
                role:
                  roleId: 5
                  name: Shipping User
                  roleKind: CUSTOMER
                users:
                  - userId: 7
                    userName: John Doe
                    loginUserName: john.doe
                    email: john.doe@customer.com
                    customerId: 1001
                    customerName: Ventana Customer
                    roles:
                      - roleId: 5
                        roleName: Shipping User
                    stations:
                      - stationId: 11
                        stationName: Station 1
                    createdByName: Admin User
                    updatedByName: Manager User
                pagination:
                  page: 1
                  pageSize: 20
                  totalCount: 1
                  totalPages: 1
        "404":
          description: Role not found
  /api/authorization/roles/{roleId}:
    parameters:
      - in: path
        name: roleId
        required: true
        schema:
          type: integer
    get:
      tags:
        - Authorization
      summary: Get a role with permissions by ID
      responses:
        "200":
          description: Role details with permission objects and hierarchy links
          content:
            application/json:
              example:
                success: true
                data:
                  roleId: 3
                  name: Dispatcher
                  roleKind: EMPLOYEE
                  status: ACTIVE
                  createdBy: 1
                  createdByName: System
                  updatedBy: 1
                  updatedByName: System
                  permissions:
                    - permissionId: 1
                      permissionCode: PER1
                      permissionKey: en_route.form.create
                  parentRoleIds: []
        "404":
          description: Role not found
    put:
      tags:
        - Authorization
      summary: Update a role
      description: Updates role fields. If permissionCodes or parentRoleIds are provided, they replace the existing assignments.
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Dispatcher
              description: Dispatch team access
              roleKind: EMPLOYEE
              status: ACTIVE
              permissionCodes: [PER1, PER2]
              parentRoleIds: []
      responses:
        "200":
          description: Role updated
        "400":
          description: Invalid role data
    delete:
      tags:
        - Authorization
      summary: Deactivate a role
      description: Soft-deletes the role by setting status to INACTIVE.
      responses:
        "200":
          description: Role deactivated
  /api/authorization/users:
    get:
      tags:
        - Authorization
      summary: List users by type
      description: Returns paginated users without password hashes, including role objects, customerName, and station objects. Search matches userName, loginUserName, or email. userCounts are total user counts by type and are unaffected by search or the selected userType.
      parameters:
        - in: query
          name: userType
          required: true
          schema:
            type: string
            enum: [EMPLOYEE, CUSTOMER]
        - in: query
          name: search
          required: false
          description: Case-insensitive partial match against name, login username, or email.
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated users and user counts by type
          content:
            application/json:
              example:
                success: true
                data:
                  - userId: 7
                    userName: John Doe
                    loginUserName: john.doe
                    email: john.doe@customer.com
                    userType: CUSTOMER
                    customerId: 1001
                    customerName: Ventana Customer
                    activeStatus: Y
                    createdBy: 1
                    createdByName: Admin User
                    updatedBy: 2
                    updatedByName: Manager User
                    roles:
                      - roleId: 5
                        roleName: Shipping User
                    stations:
                      - stationId: 11
                        stationName: Station 1
                      - stationId: 12
                        stationName: Station 2
                pagination:
                  page: 1
                  pageSize: 20
                  totalCount: 1
                  totalPages: 1
                userCounts:
                  EMPLOYEE: 14
                  CUSTOMER: 32
    post:
      tags:
        - Authorization
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            examples:
              employee:
                summary: Create an employee user
                value:
                  userName: Jane Smith
                  loginUserName: jane.smith
                  email: jane.smith@rmtrucking.com
                  userType: EMPLOYEE
                  roleIds: [2]
              customer:
                summary: Create a customer user
                value:
                  userName: John Doe
                  loginUserName: john.doe
                  email: john.doe@customer.com
                  userType: CUSTOMER
                  roleIds: [5]
                  customerId: 1001
                  stationIds: [11, 12]
            description: CUSTOMER users require a positive customerId and at least one active stationId belonging to that customer. EMPLOYEE users may omit customerId and cannot be assigned stations. A user may have only one role, supplied as a single-item roleIds array matching userType. A random 10-character password is generated, hashed for storage, and sent with the login user name to the provided email address.
      responses:
        "201":
          description: User created. data.credentialEmailSent indicates whether the initial credentials email was delivered.
  /api/authorization/users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
    get:
      tags:
        - Authorization
      summary: Get a user by ID
      responses:
        "200":
          description: User details with active role IDs and assigned station IDs
        "404":
          description: User not found
    put:
      tags:
        - Authorization
      summary: Update a user
      description: If roleIds is provided, it replaces the user's role assignment and may contain at most one role. If stationIds is provided, it replaces station assignments; CUSTOMER station IDs must be active and belong to the user's customer. stationIds is required when changing to CUSTOMER or changing customerId.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              employee:
                summary: Update an employee user
                value:
                  userName: Jane Smith
                  email: jane.smith@rmtrucking.com
                  userType: EMPLOYEE
                  roleIds: [2]
              customer:
                summary: Update a customer user
                value:
                  userName: John Doe
                  email: john.doe@customer.com
                  userType: CUSTOMER
                  roleIds: [5]
                  customerId: 1001
                  stationIds: [11, 12]
      responses:
        "200":
          description: User updated
        "400":
          description: Invalid user data
  /api/authorization/users/{userId}/status:
    patch:
      tags:
        - Authorization
      summary: Activate or inactivate a user
      description: Set activeStatus to Y to activate the user or N to inactivate the user.
      requestBody:
        required: true
        content:
          application/json:
            example:
              activeStatus: N
      responses:
        "200":
          description: User status updated
        "404":
          description: User not found
  /api/authorization/login:
    post:
      tags:
        - Authorization
      summary: Authenticate a user and return JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            example:
              loginUserName: john.doe
              password: MySecurePass123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              example:
                success: true
                data:
                  user:
                    userId: 5
                    userName: John Doe
                    email: john.doe@warehouse.local
                    userType: EMPLOYEE
                  tokenPair:
                    accessToken: eyJhbGciOi...
                    refreshToken: eyJhbGciOi...
  /api/authorization/refresh:
    post:
      tags:
        - Authorization
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            example:
              refreshToken: eyJhbGciOi...
      responses:
        "200":
          description: Access token refreshed
  /api/authorization/forgot-password:
    post:
      tags:
        - Authorization
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: john.doe@warehouse.local
      responses:
        "200":
          description: Reset email sent
  /api/authorization/validate-reset-token:
    post:
      tags:
        - Authorization
      summary: Validate a reset token
      requestBody:
        required: true
        content:
          application/json:
            example:
              token: eyJhbGciOiJIUzI1NiJ9...
      responses:
        "200":
          description: Token valid
  /api/authorization/reset-password:
    post:
      tags:
        - Authorization
      summary: Reset a password using a valid token
      requestBody:
        required: true
        content:
          application/json:
            example:
              token: eyJhbGciOiJIUzI1NiJ9...
              newPassword: NewSecurePass456
      responses:
        "200":
          description: Password reset successful
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
