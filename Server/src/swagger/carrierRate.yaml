openapi: 3.0.0
info:
  title: Rate Module API
  version: 1.0.0
  description: CRUD APIs for Transport rates, plus Terminal Rate mapping.

tags:
  - name: Carrier Transport Rate
    description: Operations related to carrier transport rates
  - name: Carrier Airport Rate
    description: Operations related to carrier airport rates
  - name: Terminal Rate Map
    description: Operations related to mapping rates to terminals

paths:
  /api/maintenance/carrier-rate/transport-rate:
    post:
      summary: Create a transport rate
      tags: [Carrier Transport Rate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransportRateRequest"
      responses:
        "201":
          description: Transport rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateResponse"

    get:
      summary: List transport rates with search and pagination
      tags: [Carrier Transport Rate]
      parameters:
        - in: query
          name: originZoneId
          schema: { type: integer }
          description: Filter by origin zone ID
        - in: query
          name: originZipOrRange
          schema: { type: string }
          description: Filter by origin zone zip code or range (e.g., "600001" or "600100-600200")
        - in: query
          name: destinationZoneId
          schema: { type: integer }
          description: Filter by destination zone ID
        - in: query
          name: destinationZipOrRange
          schema: { type: string }
          description: Filter by destination zone zip code or range (e.g., "700001" or "700100-700200")
        - in: query
          name: page
          schema: { type: integer, default: 1 }
          description: Page number for pagination
        - in: query
          name: pageSize
          schema: { type: integer, default: 10 }
          description: Number of records per page
      responses:
        "200":
          description: List of transport rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateListResponse"

  /api/maintenance/carrier-rate/transport-rate/quote:
    get:
      summary: Get transport rate quote by origin zip, destination zip, and weight
      tags: [Carrier Transport Rate]
      parameters:
        - in: query
          name: originZip
          required: true
          schema: { type: string }
          description: Origin zip code or zip range
        - in: query
          name: destinationZip
          required: true
          schema: { type: string }
          description: Destination zip code or zip range
        - in: query
          name: weight
          required: true
          schema: { type: number }
          description: Shipment weight used to calculate the quote
        - in: query
          name: terminalId
          required: true
          schema: { type: integer }
          description: Terminal ID that must have a mapped transport rate
      responses:
        "200":
          description: Transport rate quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      rateId: { type: integer }
                      carrierRateId: { type: integer }
                      calculatedRate: { type: number }
                      minRate: { type: number, nullable: true }
                      maxRate: { type: number, nullable: true }
                      matchedRateField: { type: string, nullable: true }
                      usedNearestRateField: { type: boolean }
                      details:
                        type: array
                        items:
                          $ref: "#/components/schemas/TransportRateDetail"
        "400":
          description: Invalid request or ambiguous rate selection

  /api/maintenance/carrier-rate/transport-rate/by-zone:
    get:
      summary: List transport rates by zone
      tags: [Carrier Transport Rate]
      parameters:
        - in: query
          name: zoneId
          schema: { type: integer }
          required: true
          description: Zone ID to filter rates (matches either origin or destination zone)
        - in: query
          name: page
          schema: { type: integer, default: 1 }
          description: Page number for pagination
        - in: query
          name: pageSize
          schema: { type: integer, default: 10 }
          description: Number of records per page
      responses:
        "200":
          description: List of transport rates for the given zone
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransportRateResponse"
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }

  /api/maintenance/carrier-rate/transport-rate/{id}:
    get:
      summary: Get transport rate by ID
      tags: [Carrier Transport Rate]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Transport rate found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateResponse"
        "404":
          description: Not found
    put:
      summary: Update transport rate
      tags: [Carrier Transport Rate]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransportRateRequest"
      responses:
        "200":
          description: Updated transport rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateResponse"
    delete:
      summary: Delete transport rate
      tags: [Carrier Transport Rate]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted successfully

  /api/maintenance/carrier-rate/airport-rate:
    post:
      summary: Create an airport rate
      tags: [Carrier Airport Rate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransportRateRequest"
      responses:
        "201":
          description: Airport rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateResponse"
    get:
      summary: List airport rates with search and pagination
      tags: [Carrier Airport Rate]
      parameters:
        - { in: query, name: originZoneId, schema: { type: integer } }
        - { in: query, name: originZipOrRange, schema: { type: string } }
        - { in: query, name: destinationZoneId, schema: { type: integer } }
        - { in: query, name: destinationZipOrRange, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: List of airport rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateListResponse"

  /api/maintenance/carrier-rate/airport-rate/quote:
    get:
      summary: Get an airport rate quote
      tags: [Carrier Airport Rate]
      parameters:
        - {
            in: query,
            name: originZip,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: destinationZip,
            required: true,
            schema: { type: string },
          }
        - { in: query, name: weight, required: true, schema: { type: number } }
        - {
            in: query,
            name: terminalId,
            required: true,
            schema: { type: integer },
          }
      responses:
        "200":
          description: Airport rate quote

  /api/maintenance/carrier-rate/airport-rate/by-zone:
    get:
      summary: List airport rates by zone
      tags: [Carrier Airport Rate]
      parameters:
        - { in: query, name: zoneId, required: true, schema: { type: integer } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: List of airport rates for the given zone

  /api/maintenance/carrier-rate/airport-rate/{id}:
    get:
      summary: Get airport rate by ID
      tags: [Carrier Airport Rate]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Airport rate found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateResponse"
        "404":
          description: Not found
    put:
      summary: Update airport rate
      tags: [Carrier Airport Rate]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransportRateRequest"
      responses:
        "200":
          description: Updated airport rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportRateResponse"
    delete:
      summary: Delete airport rate
      tags: [Carrier Airport Rate]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted successfully

  /api/maintenance/carrier-rate/terminal-rate-map:
    post:
      summary: Assign one or more rates to a terminal
      tags: [Terminal Rate Map]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AssignRateToTerminalRequest"
      responses:
        "201":
          description: Rates assigned to terminal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TerminalRateMapResponse"

    /api/maintenance/customer-rate/terminal-rate-map:
    get:
      summary: Get rates assigned to a terminal (optionally filtered by type or transport search criteria)
      tags: [Terminal Rate Map]
      parameters:
        - in: query
          name: terminalId
          required: true
          schema: { type: integer }
          description: ID of the terminal
        - in: query
          name: rateType
          required: false
          schema:
            type: string
            enum: [WAREHOUSE, TRANSPORT, AIRPORT]
          description: Filter rates by type. If omitted, returns all rates.
        - in: query
          name: originZoneId
          required: false
          schema: { type: integer }
          description: Filter by origin zone ID
        - in: query
          name: originZipOrRange
          required: false
          schema: { type: string }
          description: Comma-separated list of origin zip codes or ranges (e.g. "12345,23456,5671-5679")
        - in: query
          name: destinationZoneId
          required: false
          schema: { type: integer }
          description: Filter by destination zone ID
        - in: query
          name: destinationZipOrRange
          required: false
          schema: { type: string }
          description: Comma-separated list of destination zip codes or ranges (e.g. "3451-3459,67890")
      responses:
        "200":
          description: List of terminal rates (filtered if parameters provided)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TerminalRateMapResponse"

  /api/maintenance/carrier-rate/terminal-rate-map/{id}:
    delete:
      summary: Delete terminal rate mapping
      tags: [Terminal Rate Map]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted successfully

components:
  schemas:
    CreateTransportRateRequest:
      type: object
      properties:
        originZoneId: { type: integer }
        destinationZoneId: { type: integer }
        details:
          type: array
          items:
            $ref: "#/components/schemas/TransportRateDetail"
        note:
          $ref: "#/components/schemas/NoteMessageRequest"
      required: [originZoneId, destinationZoneId]

    UpdateTransportRateRequest:
      type: object
      properties:
        originZoneId: { type: integer }
        destinationZoneId: { type: integer }
        details:
          type: array
          items:
            $ref: "#/components/schemas/TransportRateDetail"
        note:
          $ref: "#/components/schemas/NoteMessageRequest"
        noteThreadId: { type: integer }

    TransportRateResponse:
      type: object
      properties:
        rateId: { type: integer }
        originZoneId: { type: integer }
        destinationZoneId: { type: integer }
        details:
          type: array
          items:
            $ref: "#/components/schemas/TransportRateDetail"

    TransportRateListResponse:
      type: object
      properties:
        rates:
          type: array
          items:
            $ref: "#/components/schemas/TransportRateResponse"
        total:
          type: integer
          description: Total number of matching records
        page:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of records per page

    TransportRateDetail:
      type: object
      properties:
        rateField: { type: string }
        chargeValue: { type: number, format: decimal }
        perUnitFlag: { type: string, enum: [Y, N] }

    AssignRateToTerminalRequest:
      type: object
      properties:
        terminalId:
          type: integer
        rateId:
          type: integer
        rateType:
          type: string
          enum: [WAREHOUSE, TRANSPORT, AIRPORT]
      required: [terminalId, rateId, rateType]

    TerminalRateMapResponse:
      type: object
      properties:
        terminalRateId: { type: integer }
        terminalId: { type: integer }
        rateId: { type: integer }
        rateType: { type: string }
        assignedBy: { type: integer }
        assignedAt: { type: string, format: date-time }

    NoteMessageRequest:
      type: object
      properties:
        messageText:
          type: string
