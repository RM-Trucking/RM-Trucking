                            multiplicationFactor: 500.0
                            multiplicationFactorUOM: "MILE"
                            rateValue: 1.50
                            totalRate: 750.00
                        linehaulSubTotalRate: 750.00
                        invoiceApprovalStatus: "N"
                      deliveryRateDetails:
                        invoiceNumber: "DL-INV-2024-001"
                        rateDetails:
                          - rateType: "BASE_RATE"
                            multiplicationFactor: 300.0
                            multiplicationFactorUOM: "LB"
                            rateValue: 0.60
                            totalRate: 180.00
                        deliverySubTotalRate: 180.00
                        invoiceApprovalStatus: "N"
                      totalCarrierRate: 1680.00
                    customerRateDetails:
                      totalCustomerRate: 1680.00
                      rateDetails:
                        - rateType: "CUSTOMER_BASE"
                          multiplicationFactor: 1680.0
                          multiplicationFactorUOM: "EA"
                          rateValue: 1.00
                          totalRate: 1680.00
              pickupAirlineFlow:
                summary: Example using pickup airline details
                value:
                  shipmentDetails:
                    typeOfShipment: "AIR_IMPORT"
