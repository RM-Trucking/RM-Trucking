openapi: 3.0.0
info:
  title: User and Role Authorization API
  version: 1.0.0
  description: Isolated RBAC module for user management, role management, login, refresh token handling, and password reset workflow.
tags:
  - name: Authorization
    description: User, role, permission, and authentication operations.
paths:
  /api/authorization/permissions/catalog:
    get:
      tags:
        - Authorization
      summary: Get permissions grouped by application
      description: Returns permissions grouped for the Warehouse, Maintenance, and Network Services tabs. Optionally filter by role kind eligibility.
      parameters:
        - in: query
          name: roleKind
          required: false
          schema:
            type: string
            enum: [EMPLOYEE, CUSTOMER]
      responses:
        "200":
          description: Permission catalog grouped by application
          content:
            application/json:
              example:
                success: true
                data:
                  warehouse:
                    warehouse_receipt:
                      - permissionId: 12
                        permissionCode: PER18
                        displayName: Edit warehouse receipt
                        applicationCode: warehouse
                        permissionKey: warehouse_receipt.receipt.edit
                        moduleKey: warehouse_receipt
                        resourceKey: receipt
                        actionKey: edit
                        forEmployee: Y
                        forCustomer: N
                  maintenance: {}
                  network_services: {}
  /api/authorization/roles/options:
    get:
      tags:
        - Authorization
      summary: Get active roles for dropdowns
      description: Returns active roles with their IDs and role kinds. Optionally filter by role kind.
      parameters:
        - in: query
          name: roleKind
          required: false
          schema:
            type: string
            enum: [EMPLOYEE, CUSTOMER]
      responses:
        "200":
          description: Active roles
          content:
            application/json:
              example:
                success: true
                data:
                  - roleId: 3
                    name: Dispatcher
                    roleKind: EMPLOYEE
  /api/authorization/roles:
    get:
      tags:
        - Authorization
      summary: List all roles
      description: Returns paginated active role records with permission codes and authority roles (parent role IDs and names). roleCounts are active-role counts for each kind and respect roleName search, but not the roleKind filter.
      parameters:
        - in: query
          name: roleKind
          required: false
          schema:
            type: string
            enum: [EMPLOYEE, CUSTOMER]
        - in: query
          name: roleName
          required: false
          description: Case-insensitive partial match against the role name.
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  - roleId: 1
                    name: SYSTEM
                    roleKind: EMPLOYEE
                    status: ACTIVE
                    permissionCodes: [PER1, PER2]
                    parentRoleIds: []
                    authorityRoles: []
                pagination:
                  page: 1
                  pageSize: 20
                  totalCount: 1
                  totalPages: 1
                roleCounts:
                  EMPLOYEE: 1
                  CUSTOMER: 0
    post:
      tags:
        - Authorization
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Customer Manager
              description: Manages customer records and service access
              roleKind: EMPLOYEE
              status: ACTIVE
              permissionCodes:
                - PER1
                - PER2
              parentRoleIds: [1, 2]
      responses:
        "201":
          description: Role created
          content:
            application/json:
              example:
                success: true
                data:
                  roleId: 2
                  name: Customer Manager
                  roleKind: EMPLOYEE
                  status: ACTIVE
  /api/authorization/roles/{roleId}:
    parameters:
      - in: path
        name: roleId
        required: true
        schema:
          type: integer
    get:
      tags:
        - Authorization
      summary: Get a role with permissions by ID
      responses:
        "200":
          description: Role details with permission objects and hierarchy links
          content:
            application/json:
              example:
                success: true
                data:
                  roleId: 3
                  name: Dispatcher
                  roleKind: EMPLOYEE
                  status: ACTIVE
                  permissions:
                    - permissionId: 1
                      permissionCode: PER1
                      permissionKey: en_route.form.create
                  parentRoleIds: []
        "404":
          description: Role not found
    put:
      tags:
        - Authorization
      summary: Update a role
      description: Updates role fields. If permissionCodes or parentRoleIds are provided, they replace the existing assignments.
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Dispatcher
              description: Dispatch team access
              roleKind: EMPLOYEE
              status: ACTIVE
              permissionCodes: [PER1, PER2]
              parentRoleIds: []
      responses:
        "200":
          description: Role updated
        "400":
          description: Invalid role data
    delete:
      tags:
        - Authorization
      summary: Deactivate a role
      description: Soft-deletes the role by setting status to INACTIVE.
      responses:
        "200":
          description: Role deactivated
  /authorization/users:
    get:
      tags:
        - Authorization
      summary: List all users
      responses:
        "200":
          description: Successful response
    post:
      tags:
        - Authorization
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            example:
              userName: John Doe
              loginUserName: john.doe
              email: john.doe@warehouse.local
              password: MySecurePass123
              userType: EMPLOYEE
              roleIds: [1, 2]
              customerId: 1001
      responses:
        "201":
          description: User created
  /authorization/users/assign-role:
    post:
      tags:
        - Authorization
      summary: Assign a role to a user
      requestBody:
        required: true
        content:
          application/json:
            example:
              userId: 5
              roleId: 3
      responses:
        "200":
          description: Role assigned successfully
  /authorization/login:
    post:
      tags:
        - Authorization
      summary: Authenticate a user and return JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            example:
              loginUserName: john.doe
              password: MySecurePass123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              example:
                success: true
                data:
                  user:
                    userId: 5
                    userName: John Doe
                    email: john.doe@warehouse.local
                    userType: EMPLOYEE
                  tokenPair:
                    accessToken: eyJhbGciOi...
                    refreshToken: eyJhbGciOi...
  /authorization/refresh:
    post:
      tags:
        - Authorization
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            example:
              refreshToken: eyJhbGciOi...
      responses:
        "200":
          description: Access token refreshed
  /authorization/forgot-password:
    post:
      tags:
        - Authorization
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: john.doe@warehouse.local
      responses:
        "200":
          description: Reset email sent
  /authorization/validate-reset-token:
    post:
      tags:
        - Authorization
      summary: Validate a reset token
      requestBody:
        required: true
        content:
          application/json:
            example:
              token: eyJhbGciOiJIUzI1NiJ9...
      responses:
        "200":
          description: Token valid
  /authorization/reset-password:
    post:
      tags:
        - Authorization
      summary: Reset a password using a valid token
      requestBody:
        required: true
        content:
          application/json:
            example:
              token: eyJhbGciOiJIUzI1NiJ9...
              newPassword: NewSecurePass456
      responses:
        "200":
          description: Password reset successful
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
